<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport"

<title>Admin Login | Lovetouch</title><style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:#f5f5f5;
  font-family:Arial,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
}

.login-box{
  width:90%;
  max-width:400px;
  background:white;
  padding:30px;
  border-radius:10px;
  box-shadow:0 3px 15px rgba(0,0,0,.12);
}

.logo{
  text-align:center;
  color:#ff9900;
  font-size:28px;
  font-weight:bold;
  margin-bottom:10px;
}

h2{
  text-align:center;
  margin-bottom:25px;
}

.form-group{
  margin-bottom:18px;
}

label{
  display:block;
  font-weight:bold;
  margin-bottom:7px;
}

input{
  width:100%;
  padding:13px;
  border:1px solid #ccc;
  border-radius:6px;
  font-size:15px;
}

button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:6px;
  background:#ff9900;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

#errorMessage{
  display:none;
  background:#ffe5e5;
  color:#b00020;
  padding:12px;
  border-radius:6px;
  margin-bottom:15px;
}

.back{
  display:block;
  text-align:center;
  margin-top:20px;
  color:#333;
  text-decoration:none;
}

</style></head><body><div class="login-box"><div class="logo">
Lovetouch
</div><h2>
Admin Login
</h2><div id="errorMessage"></div><form id="loginForm"><div class="form-group"><label>
Email
</label><input
type="email"
id="email"
placeholder="Enter admin email"
required

</div><div class="form-group"><label>
Password
</label><input
type="password"
id="password"
placeholder="Enter password"
required

«»

</div><button
type="submit"
id="loginButton"

«»

Login
</button>

</form><a

class="back"

</a>

</div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>


/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://yaukdrdygrlpdrhzpbvv.supabase.co";


const SUPABASE_KEY =
"sb_publishable_So5A7k5nsnnKyvC-MkiTMw_t6Q9poOO";


const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================
   LOGIN
========================================= */

document
.getElementById("loginForm")
.addEventListener(
"submit",
async function(event){

  event.preventDefault();


  const email =
    document
    .getElementById("email")
    .value
    .trim();


  const password =
    document
    .getElementById("password")
    .value;


  const button =
    document.getElementById(
      "loginButton"
    );


  const errorBox =
    document.getElementById(
      "errorMessage"
    );


  errorBox.style.display =
    "none";


  button.disabled =
    true;


  button.textContent =
    "Logging in...";


  try{


    const result =
      await supabaseClient.auth
      .signInWithPassword({

        email:email,

        password:password

      });


    if(result.error){

      errorBox.textContent =
        result.error.message;

      errorBox.style.display =
        "block";

      button.disabled =
        false;

      button.textContent =
        "Login";

      return;

    }


    /* LOGIN SUCCESS */

    window.location.href =
      "admin.html";


  }catch(error){

    console.error(error);


    errorBox.textContent =
      "Something went wrong. Please try again.";

    errorBox.style.display =
      "block";


    button.disabled =
      false;


    button.textContent =
      "Login";

  }

});

</script></body></html>
