<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Shopping Cart | Lovetouch</title>

<meta name="description"
content="Review your shopping cart and proceed to checkout at Lovetouch.">

<link rel="stylesheet" href="style.css">

<style>

body{
  margin:0;
  background:#f5f5f5;
  font-family:Arial,sans-serif;
}

header{
  background:#131921;
  color:white;
  padding:12px 5%;
  display:flex;
  align-items:center;
  gap:20px;
}

.logo{
  color:#ff9900;
  font-size:28px;
  font-weight:bold;
  text-decoration:none;
  white-space:nowrap;
}

.search{
  flex:1;
  display:flex;
}

.search input{
  width:100%;
  padding:13px;
  border:0;
  outline:0;
  font-size:16px;
}

.search button{
  padding:0 20px;
  border:0;
  background:#ff9900;
  font-size:18px;
}

.header-link{
  color:white;
  text-decoration:none;
  font-weight:bold;
  white-space:nowrap;
}

nav{
  background:#232f3e;
  padding:12px 5%;
}

nav a{
  color:white;
  text-decoration:none;
  margin-right:25px;
}

.cart-page{
  max-width:1100px;
  margin:35px auto;
  padding:0 20px;
}

.cart-title{
  margin-bottom:20px;
}

.cart-layout{
  display:grid;
  grid-template-columns:1fr 330px;
  gap:25px;
}

.cart-items{
  background:white;
  border-radius:8px;
  padding:20px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.cart-item{
  display:grid;
  grid-template-columns:90px 1fr auto;
  gap:18px;
  align-items:center;
  padding:18px 0;
  border-bottom:1px solid #ddd;
}

.cart-item:last-child{
  border-bottom:0;
}

.cart-icon{
  width:90px;
  height:90px;
  background:#eee;
  border-radius:7px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:45px;
}

.cart-item h3{
  margin:0 0 8px;
}

.category{
  color:#777;
  font-size:14px;
  margin-bottom:8px;
}

.item-price{
  font-weight:bold;
  font-size:18px;
}

.quantity{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:12px;
}

.quantity button{
  width:34px;
  height:34px;
  border:1px solid #ccc;
  background:#fff;
  border-radius:4px;
  font-size:20px;
  cursor:pointer;
}

.quantity span{
  min-width:30px;
  text-align:center;
  font-weight:bold;
}

.remove-btn{
  margin-top:10px;
  border:0;
  background:#dc3545;
  color:white;
  padding:8px 12px;
  border-radius:4px;
  cursor:pointer;
}

.item-total{
  font-weight:bold;
  white-space:nowrap;
}

.summary{
  background:white;
  border-radius:8px;
  padding:22px;
  height:max-content;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  position:sticky;
  top:20px;
}

.summary h2{
  margin-top:0;
}

.summary-row{
  display:flex;
  justify-content:space-between;
  padding:10px 0;
  color:#555;
}

.summary-total{
  display:flex;
  justify-content:space-between;
  border-top:1px solid #ddd;
  padding-top:15px;
  margin-top:8px;
  font-size:20px;
  font-weight:bold;
}

.checkout-btn{
  display:block;
  width:100%;
  box-sizing:border-box;
  text-align:center;
  text-decoration:none;
  background:#ffd814;
  color:#111;
  padding:14px;
  border:0;
  border-radius:5px;
  font-weight:bold;
  margin-top:18px;
}

.continue-btn{
  display:block;
  text-align:center;
  text-decoration:none;
  background:#232f3e;
  color:white;
  padding:12px;
  border-radius:5px;
  margin-top:10px;
}

.empty-cart{
  text-align:center;
  padding:60px 20px;
}

.empty-cart-icon{
  font-size:70px;
}

.empty-cart h2{
  margin:15px 0 8px;
}

.shop-btn{
  display:inline-block;
  background:#ff9900;
  color:#111;
  text-decoration:none;
  padding:13px 25px;
  border-radius:5px;
  font-weight:bold;
  margin-top:15px;
}

footer{
  background:#131921;
  color:white;
  padding:40px 5%;
  margin-top:30px;
  text-align:center;
}

@media(max-width:800px){

  .cart-layout{
    grid-template-columns:1fr;
  }

  .summary{
    position:static;
  }

}

@media(max-width:600px){

  header{
    flex-wrap:wrap;
  }

  .search{
    order:3;
    flex-basis:100%;
  }

  .cart-item{
    grid-template-columns:65px 1fr;
    gap:12px;
  }

  .cart-icon{
    width:65px;
    height:65px;
    font-size:32px;
  }

  .item-total{
    grid-column:2;
  }

}

</style>

</head>


<body>


<header>

<a href="index.html" class="logo">
Lovetouch
</a>

<div class="search">

<input
id="searchInput"
type="search"
placeholder="Search products..."
>

<button onclick="searchProducts()">
🔍
</button>

</div>

<a href="login.html" class="header-link">
👤 Account
</a>

<a href="cart.html" class="header-link">
🛒 Cart (<span id="cartCount">0</span>)
</a>

</header>


<nav>

<a href="index.html">
Home
</a>

<a href="index.html#categories">
Categories
</a>

<a href="index.html#products">
Products
</a>

<a href="index.html#deals">
Deals
</a>

</nav>


<main class="cart-page">

<h1 class="cart-title">
🛒 Shopping Cart
</h1>

<div id="cartContainer">
Loading cart...
</div>

</main>


<footer>

<h2>
Lovetouch
</h2>

<p>
Your online shopping destination.
</p>

<p>
© 2026 Lovetouch. All Rights Reserved.
</p>

</footer>


<!-- PRODUCTS -->

<script src="products.js"></script>

<!-- MAIN APP -->

<script src="app.js"></script>


<script>


/* =========================================
   CART DATA
========================================= */

function getCartData(){

  try{

    const saved =
      localStorage.getItem("lovetouchCart");

    if(!saved){
      return {};
    }

    const cart =
      JSON.parse(saved);

    if(
      cart &&
      typeof cart === "object" &&
      !Array.isArray(cart)
    ){

      return cart;

    }

  }catch(error){

    console.error(
      "Cart error:",
      error
    );

  }

  return {};

}


/* =========================================
   SAVE CART
========================================= */

function saveCartData(cart){

  localStorage.setItem(
    "lovetouchCart",
    JSON.stringify(cart)
  );

}


/* =========================================
   FIND PRODUCT
========================================= */

function findCartProduct(id){

  if(
    typeof products === "undefined" ||
    !Array.isArray(products)
  ){

    return null;

  }

  return products.find(
    function(product){

      return String(product.id) === String(id);

    }
  ) || null;

}


/* =========================================
   RENDER CART
========================================= */

function renderCart(){

  const cart =
    getCartData();

  const container =
    document.getElementById(
      "cartContainer"
    );

  const ids =
    Object.keys(cart);

  const validItems =
    ids.filter(function(id){

      const product =
        findCartProduct(id);

      const quantity =
        Number(cart[id]);

      return (
        product &&
        quantity > 0
      );

    });


  /* EMPTY CART */

  if(validItems.length === 0){

    container.innerHTML = `

      <div class="cart-items">

        <div class="empty-cart">

          <div class="empty-cart-icon">
            🛒
          </div>

          <h2>
            Your cart is empty
          </h2>

          <p>
            You haven't added any products yet.
          </p>

          <a
            href="index.html"
            class="shop-btn"
          >
            Continue Shopping
          </a>

        </div>

      </div>

    `;

    updateCartCountDisplay();

    return;

  }


  let subtotal = 0;

  let totalItems = 0;


  let html = `

    <div class="cart-layout">

      <div class="cart-items">

  `;


  validItems.forEach(function(id){

    const product =
      findCartProduct(id);

    const quantity =
      Number(cart[id]);

    const itemTotal =
      Number(product.price) * quantity;


    subtotal += itemTotal;

    totalItems += quantity;


    html += `

      <div class="cart-item">

        <div class="cart-icon">

          ${product.icon || "🛍️"}

        </div>


        <div>

          <h3>
            ${product.name}
          </h3>


          <div class="category">
            ${product.category}
          </div>


          <div class="item-price">
            ৳${Number(
              product.price
            ).toLocaleString()}
          </div>


          <div class="quantity">

            <button
              onclick="changeQuantity(
                '${product.id}',
                -1
              )"
            >
              −
            </button>


            <span>
              ${quantity}
            </span>


            <button
              onclick="changeQuantity(
                '${product.id}',
                1
              )"
            >
              +
            </button>

          </div>


          <button
            class="remove-btn"
            onclick="removeFromCart(
              '${product.id}'
            )"
          >
            Remove
          </button>

        </div>


        <div class="item-total">

          ৳${itemTotal.toLocaleString()}

        </div>

      </div>

    `;

  });


  html += `

      </div>


      <aside class="summary">

        <h2>
          Order Summary
        </h2>


        <div class="summary-row">

          <span>
            Items
          </span>

          <span>
            ${totalItems}
          </span>

        </div>


        <div class="summary-row">

          <span>
            Subtotal
          </span>

          <span>
            ৳${subtotal.toLocaleString()}
          </span>

        </div>


        <div class="summary-row">

          <span>
            Delivery
          </span>

          <span>
            Free
          </span>

        </div>


        <div class="summary-total">

          <span>
            Total
          </span>

          <span>
            ৳${subtotal.toLocaleString()}
          </span>

        </div>


        <a
          href="checkout.html"
          class="checkout-btn"
        >
          Proceed to Checkout
        </a>


        <a
          href="index.html"
          class="continue-btn"
        >
          ← Continue Shopping
        </a>

      </aside>

    </div>

  `;


  container.innerHTML =
    html;


  updateCartCountDisplay();

}


/* =========================================
   CHANGE QUANTITY
========================================= */

function changeQuantity(
  id,
  change
){

  const cart =
    getCartData();


  if(
    !Object.prototype.hasOwnProperty.call(
      cart,
      id
    )
  ){

    return;

  }


  let quantity =
    Number(cart[id]) || 0;


  quantity +=
    Number(change);


  if(quantity <= 0){

    delete cart[id];

  }else{

    cart[id] =
      quantity;

  }


  saveCartData(cart);

  renderCart();

}


/* =========================================
   REMOVE PRODUCT
========================================= */

function removeFromCart(id){

  const cart =
    getCartData();


  delete cart[id];


  saveCartData(cart);


  renderCart();

}


/* =========================================
   UPDATE CART COUNT
========================================= */

function updateCartCountDisplay(){

  const cart =
    getCartData();


  let count = 0;


  Object.keys(cart).forEach(
    function(id){

      const product =
        findCartProduct(id);

      const quantity =
        Number(cart[id]) || 0;


      if(
        product &&
        quantity > 0
      ){

        count += quantity;

      }

    }
  );


  const element =
    document.getElementById(
      "cartCount"
    );


  if(element){

    element.textContent =
      count;

  }

}


/* =========================================
   SEARCH
========================================= */

function searchProducts(){

  const input =
    document.getElementById(
      "searchInput"
    );


  if(!input){
    return;
  }


  const value =
    input.value.trim();


  if(value){

    window.location.href =
      "index.html?search=" +
      encodeURIComponent(value);

  }

}


/* =========================================
   START
========================================= */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    renderCart();

  }
);


</script>


</body>

</html>
