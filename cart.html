<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Shopping Cart | Lovetouch</title>

<link rel="stylesheet" href="style.css">

<style>

header{
  background:#131921;
  color:white;
  padding:12px 5%;
  display:flex;
  align-items:center;
  gap:20px;
}

.logo{
  color:#ff9900;
  font-size:28px;
  font-weight:bold;
}

.search{
  flex:1;
}

.search input{
  width:100%;
  padding:13px;
  border:0;
  outline:0;
}

.header-link{
  color:white;
  font-weight:bold;
  white-space:nowrap;
}

nav{
  background:#232f3e;
  padding:12px 5%;
}

nav a{
  color:white;
  margin-right:25px;
}

.cart-page{
  max-width:1200px;
  margin:30px auto;
  padding:20px;
}

.cart-layout{
  display:grid;
  grid-template-columns:1fr 350px;
  gap:25px;
}

.cart-box,
.summary{
  background:white;
  border-radius:8px;
  padding:25px;
}

.cart-item{
  display:grid;
  grid-template-columns:110px 1fr auto;
  gap:20px;
  padding:20px 0;
  border-bottom:1px solid #ddd;
  align-items:center;
}

.cart-image{
  width:110px;
  height:110px;
  background:#eee;
  display:flex;
  justify-content:center;
  align-items:center;
  border-radius:8px;
  font-size:60px;
}

.cart-name{
  font-size:19px;
  font-weight:bold;
  margin-bottom:8px;
}

.cart-price{
  font-size:18px;
  font-weight:bold;
  margin-bottom:10px;
}

.quantity{
  display:flex;
  align-items:center;
  gap:8px;
}

.quantity button{
  width:34px;
  height:34px;
  border:1px solid #ccc;
  background:white;
  font-size:20px;
}

.quantity span{
  width:30px;
  text-align:center;
  font-weight:bold;
}

.remove{
  border:0;
  background:none;
  color:#d62828;
  margin-top:10px;
}

.item-total{
  font-size:18px;
  font-weight:bold;
  white-space:nowrap;
}

.summary h2{
  margin-bottom:20px;
}

.summary-row{
  display:flex;
  justify-content:space-between;
  margin:15px 0;
}

.total{
  border-top:1px solid #ddd;
  padding-top:20px;
  font-size:24px;
  font-weight:bold;
}

.checkout-btn{
  width:100%;
  padding:14px;
  border:0;
  border-radius:6px;
  background:#ff9900;
  font-weight:bold;
  font-size:16px;
  margin-top:20px;
}

.continue{
  display:inline-block;
  margin-top:20px;
  color:#0066c0;
}

.empty{
  display:none;
  text-align:center;
  padding:60px 20px;
}

.empty-icon{
  font-size:70px;
  margin-bottom:15px;
}

.shop-btn{
  display:inline-block;
  margin-top:20px;
  padding:13px 25px;
  background:#ffd814;
  color:#222;
  border-radius:5px;
  font-weight:bold;
}

@media(max-width:800px){

  header{
    flex-wrap:wrap;
  }

  .search{
    order:3;
    flex-basis:100%;
  }

  .cart-layout{
    grid-template-columns:1fr;
  }

  .cart-item{
    grid-template-columns:80px 1fr;
  }

  .cart-image{
    width:80px;
    height:80px;
    font-size:45px;
  }

  .item-total{
    grid-column:2;
  }

}

</style>

</head>

<body>

<header>

<a href="index.html"
class="logo">
Lovetouch
</a>

<div class="search">

<input
type="search"
placeholder="Search products..."
>

</div>

<a href="login.html"
class="header-link">
👤 Account
</a>

<a href="cart.html"
class="header-link">
🛒 Cart (<span id="cartCount">0</span>)
</a>

</header>

<nav>

<a href="index.html">
Home
</a>

<a href="index.html#categories">
Categories
</a>

<a href="index.html#products">
Products
</a>

</nav>

<main class="cart-page">

<h1>
Shopping Cart
</h1>

<br>

<div
class="cart-layout"
id="cartLayout"
>

<div class="cart-box">

<div id="cartItems">
</div>

<a
href="index.html"
class="continue"
>
← Continue Shopping
</a>

</div>

<div class="summary">

<h2>
Order Summary
</h2>

<div class="summary-row">

<span>
Subtotal
</span>

<strong id="subtotal">
৳0
</strong>

</div>

<div class="summary-row">

<span>
Delivery
</span>

<strong id="delivery">
৳0
</strong>

</div>

<div class="summary-row total">

<span>
Total
</span>

<strong id="total">
৳0
</strong>

</div>

<button
class="checkout-btn"
onclick="goCheckout()"
>
Proceed to Checkout
</button>

</div>

</div>

<div
class="cart-box empty"
id="emptyCart"
>

<div class="empty-icon">
🛒
</div>

<h2>
Your cart is empty
</h2>

<p>
Add some products to your cart first.
</p>

<a
href="index.html"
class="shop-btn"
>
Start Shopping
</a>

</div>

</main>

<footer>

<h2>
Lovetouch
</h2>

<p>
© 2026 Lovetouch. All Rights Reserved.
</p>

</footer>

<script src="products.js"></script>

<script src="app.js"></script>

<script>

function renderCart(){

  const cart = getCart();

  const container =
    document.getElementById(
      "cartItems"
    );

  container.innerHTML="";

  let subtotal = 0;

  let count = 0;

  Object.keys(cart).forEach(
    function(productId){

      const product =
        products.find(
          p => p.id === productId
        );

      if(!product){
        return;
      }

      const quantity =
        cart[productId];

      const itemTotal =
        product.price * quantity;

      subtotal += itemTotal;

      count += quantity;

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "cart-item";

      item.innerHTML = `

        <div class="cart-image">
          ${product.icon}
        </div>

        <div>

          <div class="cart-name">
            ${product.name}
          </div>

          <div class="cart-price">
            ৳${product.price.toLocaleString()}
          </div>

          <div class="quantity">

            <button
              onclick="changeQty('${productId}',-1)"
            >
              −
            </button>

            <span>
              ${quantity}
            </span>

            <button
              onclick="changeQty('${productId}',1)"
            >
              +
            </button>

          </div>

          <button
            class="remove"
            onclick="removeItem('${productId}')"
          >
            🗑️ Remove
          </button>

        </div>

        <div class="item-total">
          ৳${itemTotal.toLocaleString()}
        </div>

      `;

      container.appendChild(item);

    }
  );


  const delivery =
    subtotal > 0 ? 100 : 0;

  document.getElementById(
    "subtotal"
  ).textContent =
    "৳" + subtotal.toLocaleString();

  document.getElementById(
    "delivery"
  ).textContent =
    "৳" + delivery.toLocaleString();

  document.getElementById(
    "total"
  ).textContent =
    "৳" +
    (subtotal + delivery)
    .toLocaleString();

  document.getElementById(
    "cartCount"
  ).textContent =
    count;


  if(count === 0){

    document.getElementById(
      "cartLayout"
    ).style.display="none";

    document.getElementById(
      "emptyCart"
    ).style.display="block";

  }else{

    document.getElementById(
      "cartLayout"
    ).style.display="grid";

    document.getElementById(
      "emptyCart"
    ).style.display="none";

  }

}


function changeQty(
  productId,
  change
){

  const cart = getCart();

  const newQuantity =
    (cart[productId] || 0)
    + change;

  updateCartQuantity(
    productId,
    newQuantity
  );

  renderCart();

}


function removeItem(productId){

  removeProductFromCart(
    productId
  );

  renderCart();

}


function goCheckout(){

  const cart = getCart();

  if(
    Object.keys(cart).length === 0
  ){

    alert(
      "Your cart is empty."
    );

    return;

  }

  window.location.href =
    "checkout.html";

}


renderCart();

</script>

</body>

</html>
