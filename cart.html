<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shopping Cart | Lovetouch</title>

<meta name="description"
content="Your Lovetouch shopping cart.">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f5f5;
  color:#222;
}

/* HEADER */

header{
  background:#131921;
  color:white;
  padding:12px 5%;
  display:flex;
  align-items:center;
  gap:25px;
}

.logo{
  color:#ff9900;
  font-size:28px;
  font-weight:bold;
  text-decoration:none;
}

.search{
  flex:1;
  display:flex;
}

.search input{
  width:100%;
  padding:13px;
  border:none;
  outline:none;
}

.search button{
  background:#ff9900;
  border:none;
  padding:0 20px;
  cursor:pointer;
}

.header-link{
  color:white;
  text-decoration:none;
  font-weight:bold;
  white-space:nowrap;
}

/* NAV */

nav{
  background:#232f3e;
  padding:12px 5%;
}

nav a{
  color:white;
  text-decoration:none;
  margin-right:25px;
}

/* CONTAINER */

.container{
  max-width:1200px;
  margin:30px auto;
  padding:0 20px;
}

.page-title{
  margin-bottom:20px;
  font-size:30px;
}

/* LAYOUT */

.cart-layout{
  display:grid;
  grid-template-columns:1fr 350px;
  gap:25px;
}

.cart-box,
.summary{
  background:white;
  border-radius:8px;
  padding:25px;
}

/* CART ITEM */

.cart-item{
  display:grid;
  grid-template-columns:120px 1fr auto;
  gap:20px;
  padding:20px 0;
  border-bottom:1px solid #ddd;
  align-items:center;
}

.product-image{
  width:120px;
  height:120px;
  background:#eee;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:60px;
  border-radius:8px;
}

.product-name{
  font-size:20px;
  font-weight:bold;
  margin-bottom:8px;
}

.price{
  font-size:20px;
  font-weight:bold;
  margin-bottom:10px;
}

.stock{
  color:green;
  font-size:14px;
  margin-bottom:12px;
}

/* QUANTITY */

.quantity{
  display:flex;
  align-items:center;
  gap:8px;
}

.quantity button{
  width:35px;
  height:35px;
  border:1px solid #ccc;
  background:white;
  font-size:20px;
  cursor:pointer;
}

.quantity span{
  width:35px;
  text-align:center;
  font-weight:bold;
}

.remove{
  color:#d62828;
  border:none;
  background:none;
  cursor:pointer;
  margin-top:10px;
}

/* ITEM TOTAL */

.item-total{
  font-size:20px;
  font-weight:bold;
  white-space:nowrap;
}

/* SUMMARY */

.summary h2{
  margin-bottom:20px;
}

.summary-row{
  display:flex;
  justify-content:space-between;
  margin:15px 0;
}

.total{
  border-top:1px solid #ddd;
  padding-top:20px;
  font-size:24px;
  font-weight:bold;
}

.checkout{
  width:100%;
  padding:14px;
  background:#ff9900;
  border:none;
  border-radius:5px;
  font-weight:bold;
  font-size:16px;
  cursor:pointer;
  margin-top:20px;
}

.checkout:hover{
  background:#f08800;
}

/* EMPTY */

.empty{
  display:none;
  text-align:center;
  padding:60px 20px;
}

.empty-icon{
  font-size:70px;
  margin-bottom:15px;
}

.shop-btn{
  display:inline-block;
  margin-top:20px;
  padding:13px 25px;
  background:#ffd814;
  color:#222;
  text-decoration:none;
  border-radius:5px;
  font-weight:bold;
}

/* FOOTER */

footer{
  background:#131921;
  color:white;
  text-align:center;
  padding:35px;
  margin-top:40px;
}

/* MOBILE */

@media(max-width:800px){

  header{
    flex-wrap:wrap;
  }

  .search{
    order:3;
    flex-basis:100%;
  }

  .cart-layout{
    grid-template-columns:1fr;
  }

  .cart-item{
    grid-template-columns:90px 1fr;
  }

  .product-image{
    width:90px;
    height:90px;
    font-size:45px;
  }

  .item-total{
    grid-column:2;
  }

}

</style>

</head>

<body>

<!-- HEADER -->

<header>

<a href="index.html" class="logo">
Lovetouch
</a>

<div class="search">

<input
type="text"
placeholder="Search products..."
>

<button>
🔍
</button>

</div>

<a href="login.html" class="header-link">
👤 Account
</a>

<a href="cart.html" class="header-link">
🛒 Cart (<span id="cartCount">0</span>)
</a>

</header>

<!-- NAV -->

<nav>

<a href="index.html">
Home
</a>

<a href="index.html#categories">
Categories
</a>

<a href="index.html#products">
Products
</a>

<a href="#">
Deals
</a>

</nav>

<!-- MAIN -->

<main class="container">

<h1 class="page-title">
Shopping Cart
</h1>

<!-- CART -->

<div
class="cart-layout"
id="cartLayout"
>

<div class="cart-box">

<div id="cartItems">
</div>

<a
href="index.html"
class="shop-btn"
>
← Continue Shopping
</a>

</div>

<!-- SUMMARY -->

<div class="summary">

<h2>
Order Summary
</h2>

<div class="summary-row">

<span>
Subtotal
</span>

<strong id="subtotal">
৳0
</strong>

</div>

<div class="summary-row">

<span>
Delivery
</span>

<strong id="delivery">
৳100
</strong>

</div>

<div class="summary-row total">

<span>
Total
</span>

<strong id="total">
৳100
</strong>

</div>

<button
class="checkout"
onclick="goCheckout()"
>
Proceed to Checkout
</button>

</div>

</div>

<!-- EMPTY CART -->

<div
class="cart-box empty"
id="emptyCart"
>

<div class="empty-icon">
🛒
</div>

<h2>
Your cart is empty
</h2>

<p>
Looks like you haven't added anything yet.
</p>

<a
href="index.html"
class="shop-btn"
>
Start Shopping
</a>

</div>

</main>

<!-- FOOTER -->

<footer>

<h2>
Lovetouch
</h2>

<p>
© 2026 Lovetouch. All Rights Reserved.
</p>

</footer>

<script>

/* PRODUCTS */

const products = [

{
id:"smartphone",
name:"Smartphone Pro Max",
price:25999,
icon:"📱"
},

{
id:"headphones",
name:"Wireless Headphones",
price:1499,
icon:"🎧"
},

{
id:"watch",
name:"Smart Watch",
price:2299,
icon:"⌚"
},

{
id:"shoes",
name:"Premium Running Shoes",
price:1899,
icon:"👟"
}

];


/* GET CART */

function getCart(){

return JSON.parse(
localStorage.getItem("lovetouchCart")
) || {};

}


/* SAVE CART */

function saveCart(cart){

localStorage.setItem(
"lovetouchCart",
JSON.stringify(cart)
);

}


/* ADD DEFAULT CART FROM OLD SYSTEM */

function migrateOldCart(){

const oldCount =
parseInt(
localStorage.getItem("lovetouchCartCount")
) || 0;

const currentCart = getCart();

if(
oldCount > 0 &&
Object.keys(currentCart).length === 0
){

currentCart.smartphone = oldCount;

saveCart(currentCart);

localStorage.removeItem(
"lovetouchCartCount"
);

}

}


/* RENDER CART */

function renderCart(){

const cart = getCart();

const container =
document.getElementById("cartItems");

container.innerHTML="";

let subtotal=0;

let itemCount=0;

Object.keys(cart).forEach(function(id){

const quantity =
cart[id];

const product =
products.find(
p => p.id === id
);

if(!product) return;

const itemSubtotal =
product.price * quantity;

subtotal += itemSubtotal;

itemCount += quantity;

const item =
document.createElement("div");

item.className="cart-item";

item.innerHTML=`

<div class="product-image">
${product.icon}
</div>

<div>

<div class="product-name">
${product.name}
</div>

<div class="stock">
✓ In Stock
</div>

<div class="price">
৳${product.price.toLocaleString()}
</div>

<div class="quantity">

<button onclick="changeQuantity('${id}',-1)">
−
</button>

<span>
${quantity}
</span>

<button onclick="changeQuantity('${id}',1)">
+
</button>

</div>

<button
class="remove"
onclick="removeProduct('${id}')"
>
🗑️ Remove
</button>

</div>

<div class="item-total">

৳${itemSubtotal.toLocaleString()}

</div>

`;

container.appendChild(item);

});


/* UPDATE SUMMARY */

document.getElementById(
"subtotal"
).textContent =
"৳" + subtotal.toLocaleString();

const delivery =
subtotal > 0 ? 100 : 0;

document.getElementById(
"delivery"
).textContent =
"৳" + delivery.toLocaleString();

document.getElementById(
"total"
).textContent =
"৳" +
(subtotal + delivery).toLocaleString();

document.getElementById(
"cartCount"
).textContent =
itemCount;


/* EMPTY */

if(itemCount === 0){

document.getElementById(
"cartLayout"
).style.display="none";

document.getElementById(
"emptyCart"
).style.display="block";

}else{

document.getElementById(
"cartLayout"
).style.display="grid";

document.getElementById(
"emptyCart"
).style.display="none";

}

}


/* CHANGE QUANTITY */

function changeQuantity(id,change){

const cart =
getCart();

cart[id] =
(cart[id] || 0) + change;

if(cart[id] <= 0){

delete cart[id];

}

saveCart(cart);

renderCart();

}


/* REMOVE */

function removeProduct(id){

const cart =
getCart();

delete cart[id];

saveCart(cart);

renderCart();

}


/* CHECKOUT */

function goCheckout(){

const cart =
getCart();

if(
Object.keys(cart).length === 0
){

alert(
"Your cart is empty."
);

return;

}

window.location.href =
"checkout.html";

}


/* START */

migrateOldCart();

renderCart();

</script>

</body>
</html>
