<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Product Details | Lovetouch</title>
<meta name="description" content="View product details and shop online at Lovetouch.">

<link rel="stylesheet" href="style.css">

<style>
body{
  margin:0;
  background:#f5f5f5;
  font-family:Arial,sans-serif;
}

header{
  background:#131921;
  color:white;
  padding:12px 5%;
  display:flex;
  align-items:center;
  gap:20px;
}

.logo{
  color:#ff9900;
  font-size:28px;
  font-weight:bold;
  text-decoration:none;
  white-space:nowrap;
}

.search{
  flex:1;
  display:flex;
}

.search input{
  width:100%;
  padding:13px;
  border:0;
  outline:0;
  font-size:16px;
}

.search button{
  padding:0 20px;
  border:0;
  background:#ff9900;
  font-size:18px;
}

.header-link{
  color:white;
  text-decoration:none;
  font-weight:bold;
  white-space:nowrap;
}

nav{
  background:#232f3e;
  padding:12px 5%;
}

nav a{
  color:white;
  text-decoration:none;
  margin-right:25px;
}

.product-page{
  max-width:1100px;
  margin:40px auto;
  padding:0 20px;
}

.breadcrumb{
  margin-bottom:20px;
  color:#666;
}

.breadcrumb a{
  color:#222;
  text-decoration:none;
}

.product-box{
  background:white;
  border-radius:10px;
  padding:30px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:40px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.product-image-large{
  min-height:420px;
  background:#eee;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:160px;
}

.product-details h1{
  font-size:36px;
  margin:0 0 15px;
}

.rating{
  margin:10px 0;
  font-size:20px;
}

.category{
  color:#666;
  margin:12px 0;
}

.price{
  font-size:30px;
  font-weight:bold;
  margin:20px 0;
}

.old-price{
  font-size:18px;
  color:#888;
  text-decoration:line-through;
  margin-left:10px;
  font-weight:normal;
}

.description{
  color:#555;
  line-height:1.7;
  margin:20px 0;
}

.quantity-box{
  display:flex;
  align-items:center;
  gap:12px;
  margin:20px 0;
}

.quantity-box input{
  width:70px;
  padding:12px;
  border:1px solid #ccc;
  border-radius:5px;
  text-align:center;
}

.add-cart{
  width:100%;
  background:#ffd814;
  border:0;
  padding:15px;
  border-radius:6px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.back-btn{
  display:inline-block;
  margin-top:15px;
  background:#232f3e;
  color:white;
  text-decoration:none;
  padding:12px 20px;
  border-radius:5px;
}

.message{
  margin-top:15px;
  padding:12px;
  background:#e8f5e9;
  color:#256029;
  border-radius:5px;
  display:none;
}

footer{
  background:#131921;
  color:white;
  padding:40px 5%;
  margin-top:30px;
  text-align:center;
}

@media(max-width:700px){
  .product-box{
    grid-template-columns:1fr;
    padding:20px;
  }

  .product-image-large{
    min-height:280px;
    font-size:110px;
  }

  .product-details h1{
    font-size:28px;
  }

  header{
    flex-wrap:wrap;
  }

  .search{
    order:3;
    flex-basis:100%;
  }
}
</style>
</head>

<body>

<header>

<a href="index.html" class="logo">Lovetouch</a>

<div class="search">
<input id="searchInput" type="search" placeholder="Search products...">
<button onclick="searchProducts()">🔍</button>
</div>

<a href="login.html" class="header-link">👤 Account</a>

<a href="cart.html" class="header-link">
🛒 Cart (<span id="cartCount">0</span>)
</a>

</header>

<nav>
<a href="index.html">Home</a>
<a href="index.html#categories">Categories</a>
<a href="index.html#products">Products</a>
<a href="index.html#deals">Deals</a>
</nav>

<main class="product-page">

<div class="breadcrumb">
<a href="index.html">Home</a> › Product Details
</div>

<div class="product-box" id="productContainer">
Loading product...
</div>

</main>

<footer>
<h2>Lovetouch</h2>
<p>Your online shopping destination.</p>
<p>© 2026 Lovetouch. All Rights Reserved.</p>
</footer>

<script src="products.js"></script>
<script src="app.js"></script>

<script>

function getProductId(){

  const params = new URLSearchParams(window.location.search);

  return params.get("id");

}


function updateCartCount(){

  if(typeof getCartItemCount === "function"){

    document.getElementById("cartCount").textContent =
      getCartItemCount();

  }

}


function searchProducts(){

  const value =
    document.getElementById("searchInput").value.trim();

  if(value){

    window.location.href =
      "index.html?search=" + encodeURIComponent(value);

  }

}


function getDescription(product){

  if(product.description){
    return product.description;
  }

  return "Discover the " +
    product.name +
    " at Lovetouch. Enjoy quality products, great prices and a simple online shopping experience.";

}


function renderProduct(){

  const id = getProductId();

  const product =
    products.find(function(item){
      return String(item.id) === String(id);
    });

  const container =
    document.getElementById("productContainer");

  if(!product){

    container.innerHTML = `
      <div style="grid-column:1/-1;text-align:center;padding:50px">
        <h2>Product Not Found</h2>
        <p>The product you are looking for is not available.</p>
        <a href="index.html" class="back-btn">← Back to Store</a>
      </div>
    `;

    return;
  }

  const stars =
    "⭐".repeat(Number(product.rating) || 0);

  container.innerHTML = `

    <div class="product-image-large">
      ${product.icon || "🛍️"}
    </div>

    <div class="product-details">

      <h1>${product.name}</h1>

      <div class="rating">
        ${stars}
      </div>

      <div class="category">
        Category: <strong>${product.category}</strong>
      </div>

      <div class="price">
        ৳${Number(product.price).toLocaleString()}

        ${
          product.oldPrice
          ? `<span class="old-price">
              ৳${Number(product.oldPrice).toLocaleString()}
             </span>`
          : ""
        }

      </div>

      <p class="description">
        ${getDescription(product)}
      </p>

      <div class="quantity-box">
        <label for="quantity"><strong>Quantity:</strong></label>

        <input
          id="quantity"
          type="number"
          min="1"
          value="1"
        >
      </div>

      <button
        class="add-cart"
        onclick="addToCartFromDetails('${product.id}')"
      >
        🛒 Add to Cart
      </button>

      <div id="message" class="message">
        Product added to cart successfully!
      </div>

      <a href="index.html" class="back-btn">
        ← Continue Shopping
      </a>

    </div>

  `;

}


function addToCartFromDetails(id){

  const quantity =
    Math.max(
      1,
      parseInt(
        document.getElementById("quantity").value
      ) || 1
    );

  /*
    Use the existing cart function from app.js.
    The loop allows this page to work with the
    existing one-item-at-a-time cart function.
  */

  if(typeof addProductToCart === "function"){

    for(let i = 0; i < quantity; i++){
      addProductToCart(id);
    }

    updateCartCount();

    const message =
      document.getElementById("message");

    message.style.display = "block";

  }else{

    alert("Cart system is not available.");

  }

}


renderProduct();
updateCartCount();

</script>

</body>
</html>
