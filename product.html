<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Product Details | Lovetouch</title>

<link rel="stylesheet" href="style.css">

<style>

header{
  background:#131921;
  padding:12px 5%;
  display:flex;
  align-items:center;
  gap:20px;
}

.logo{
  color:#ff9900;
  font-size:28px;
  font-weight:bold;
}

.search{
  flex:1;
}

.search input{
  width:100%;
  padding:13px;
  border:0;
}

.header-link{
  color:white;
  font-weight:bold;
  white-space:nowrap;
}

nav{
  background:#232f3e;
  padding:12px 5%;
}

nav a{
  color:white;
  margin-right:25px;
}

.product-page{
  max-width:1100px;
  margin:35px auto;
  padding:20px;
}

.product-box{
  background:white;
  border-radius:10px;
  padding:30px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:40px;
}

.product-photo{
  min-height:420px;
  background:#eee;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:150px;
}

.product-title{
  font-size:35px;
  margin-bottom:12px;
}

.product-rating{
  color:#f5a623;
  margin-bottom:15px;
}

.product-price{
  font-size:32px;
  font-weight:bold;
  margin:15px 0;
}

.product-old-price{
  color:#777;
  text-decoration:line-through;
  font-size:17px;
  margin-left:10px;
}

.stock{
  color:green;
  margin:15px 0;
}

.description{
  line-height:1.7;
  color:#555;
  margin:20px 0;
}

.quantity{
  display:flex;
  align-items:center;
  gap:10px;
  margin:20px 0;
}

.quantity button{
  width:40px;
  height:40px;
  border:1px solid #ccc;
  background:white;
  font-size:22px;
}

.quantity span{
  width:40px;
  text-align:center;
  font-weight:bold;
}

.action-btn{
  width:100%;
  padding:15px;
  border:0;
  border-radius:6px;
  font-weight:bold;
  font-size:16px;
  margin-top:10px;
}

.add-cart{
  background:#ffd814;
}

.buy-now{
  background:#ff9900;
}

.back{
  display:inline-block;
  margin-top:20px;
  color:#0066c0;
}

@media(max-width:800px){

  header{
    flex-wrap:wrap;
  }

  .search{
    order:3;
    flex-basis:100%;
  }

  .product-box{
    grid-template-columns:1fr;
  }

  .product-photo{
    min-height:300px;
    font-size:100px;
  }

}

</style>

</head>

<body>

<header>

<a href="index.html" class="logo">
Lovetouch
</a>

<div class="search">

<input
type="search"
placeholder="Search products..."
>

</div>

<a href="login.html"
class="header-link">
👤 Account
</a>

<a href="cart.html"
class="header-link">
🛒 Cart
</a>

</header>

<nav>

<a href="index.html">
Home
</a>

<a href="index.html#categories">
Categories
</a>

<a href="index.html#products">
Products
</a>

</nav>

<main class="product-page">

<div class="product-box">

<div
class="product-photo"
id="productImage"
>
🛍️
</div>

<div>

<div
id="productCategory"
>
Product
</div>

<h1
class="product-title"
id="productName"
>
Loading...
</h1>

<div
class="product-rating"
id="productRating"
>
</div>

<div
class="product-price"
id="productPrice"
>
</div>

<div
id="productStock"
class="stock"
>
</div>

<p
id="productDescription"
class="description"
>
</p>

<div class="quantity">

<button
onclick="changeQuantity(-1)"
>
−
</button>

<span id="quantity">
1
</span>

<button
onclick="changeQuantity(1)"
>
+
</button>

</div>

<button
class="action-btn add-cart"
onclick="addCurrentProduct()"
>
🛒 Add to Cart
</button>

<button
class="action-btn buy-now"
onclick="buyNow()"
>
⚡ Buy Now
</button>

<a
href="index.html"
class="back"
>
← Continue Shopping
</a>

</div>

</div>

</main>

<footer>

<h2>
Lovetouch
</h2>

<p>
© 2026 Lovetouch. All Rights Reserved.
</p>

</footer>

<script src="products.js"></script>

<script src="app.js"></script>

<script>

let quantity = 1;

const params =
new URLSearchParams(
window.location.search
);

const productId =
params.get("id");

const product =
products.find(function(item){

  return item.id === productId;

});


function showProduct(){

  if(!product){

    document.getElementById(
      "productName"
    ).textContent =
      "Product Not Found";

    return;

  }

  document.getElementById(
    "productImage"
  ).textContent =
    product.icon;

  document.getElementById(
    "productCategory"
  ).textContent =
    product.category;

  document.getElementById(
    "productName"
  ).textContent =
    product.name;

  document.getElementById(
    "productRating"
  ).textContent =
    "⭐".repeat(product.rating);

  document.getElementById(
    "productPrice"
  ).innerHTML =
    `৳${product.price.toLocaleString()}
     <span class="product-old-price">
     ৳${product.oldPrice.toLocaleString()}
     </span>`;

  document.getElementById(
    "productStock"
  ).textContent =
    product.stock > 0
      ? "✓ In Stock"
      : "Out of Stock";

  document.getElementById(
    "productDescription"
  ).textContent =
    product.description;

}


function changeQuantity(change){

  quantity += change;

  if(quantity < 1){
    quantity = 1;
  }

  if(product &&
     quantity > product.stock){

    quantity = product.stock;

  }

  document.getElementById(
    "quantity"
  ).textContent =
    quantity;

}


function addCurrentProduct(){

  if(!product){
    return;
  }

  if(product.stock <= 0){

    alert("Product is out of stock.");

    return;

  }

  addProductToCart(
    product.id,
    quantity
  );

  alert(
    product.name +
    " added to cart!"
  );

}


function buyNow(){

  if(!product){
    return;
  }

  addProductToCart(
    product.id,
    quantity
  );

  window.location.href =
    "cart.html";

}


showProduct();

</script>

</body>

  </html>
