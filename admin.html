<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Admin Panel | Lovetouch</title>

<link rel="stylesheet" href="style.css">

<style>

body{
  background:#f5f5f5;
}

.admin-header{
  background:#131921;
  color:white;
  padding:18px 5%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.admin-logo{
  color:#ff9900;
  font-size:27px;
  font-weight:bold;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:15px;
}

.admin-header a{
  color:white;
  font-weight:bold;
}

.logout-btn{
  background:#d62828;
  color:white;
  border:0;
  padding:9px 14px;
  border-radius:5px;
  cursor:pointer;
  font-weight:bold;
}

.admin-page{
  max-width:1200px;
  margin:30px auto;
  padding:20px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
  margin-bottom:25px;
}

.stat{
  background:white;
  padding:25px;
  border-radius:8px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.stat-number{
  font-size:30px;
  font-weight:bold;
  margin-top:8px;
}

.orders-box{
  background:white;
  padding:25px;
  border-radius:8px;
  overflow-x:auto;
}

.order-card{
  border:1px solid #ddd;
  border-radius:7px;
  padding:20px;
  margin-bottom:15px;
}

.order-top{
  display:flex;
  justify-content:space-between;
  gap:15px;
  flex-wrap:wrap;
  margin-bottom:15px;
}

.order-id{
  font-weight:bold;
}

.order-status{
  padding:6px 12px;
  border-radius:20px;
  font-size:13px;
  font-weight:bold;
}

.status-new{
  background:#fff3cd;
}

.status-processing{
  background:#dbeafe;
}

.status-shipped{
  background:#e0e7ff;
}

.status-delivered{
  background:#dcfce7;
}

.status-cancelled{
  background:#fee2e2;
}

.status-control{
  margin:15px 0;
  padding:15px;
  background:#f8f8f8;
  border-radius:6px;
}

.status-control label{
  display:block;
  font-weight:bold;
  margin-bottom:8px;
}

.status-select{
  width:100%;
  max-width:300px;
  padding:10px;
  border:1px solid #ccc;
  border-radius:5px;
  background:white;
}

.customer{
  background:#f8f8f8;
  padding:15px;
  border-radius:6px;
  margin-bottom:15px;
}

.order-product{
  display:flex;
  justify-content:space-between;
  padding:8px 0;
  border-bottom:1px solid #eee;
}

.order-total{
  text-align:right;
  font-size:20px;
  font-weight:bold;
  margin-top:15px;
}

.delete-btn{
  background:#d62828;
  color:white;
  border:0;
  padding:9px 15px;
  border-radius:5px;
  cursor:pointer;
  margin-top:15px;
}

.clear-btn{
  background:#d62828;
  color:white;
  border:0;
  padding:12px 18px;
  border-radius:5px;
  cursor:pointer;
  font-weight:bold;
}

.no-orders{
  text-align:center;
  padding:50px;
  color:#777;
}

.loading{
  text-align:center;
  padding:40px;
  color:#777;
}

.error{
  background:#ffe5e5;
  color:#b00020;
  padding:15px;
  border-radius:6px;
  margin-bottom:20px;
}

.success{
  background:#e7f7ed;
  color:#137333;
  padding:12px;
  border-radius:6px;
  margin-bottom:20px;
}

@media(max-width:700px){

  .stats{
    grid-template-columns:1fr;
  }

  .admin-header{
    flex-wrap:wrap;
  }

  .header-actions{
    width:100%;
    justify-content:space-between;
  }

}

</style>

</head>

<body>

<header class="admin-header">

<div class="admin-logo">
Lovetouch Admin
</div>

<div class="header-actions">

<a href="index.html">
← Visit Store
</a>

<button
class="logout-btn"
onclick="logout()"
>
Logout
</button>

</div>

</header>

<main class="admin-page">

<h1>
Dashboard
</h1>

<br>

<div class="stats">

<div class="stat">

<div>
Total Orders
</div>

<div
class="stat-number"
id="totalOrders"
>
0
</div>

</div>

<div class="stat">

<div>
Total Products
</div>

<div
class="stat-number"
id="totalProducts"
>
0
</div>

</div>

<div class="stat">

<div>
Total Customers
</div>

<div
class="stat-number"
id="totalCustomers"
>
0
</div>

</div>

</div>

<div class="orders-box">

<div style="
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
margin-bottom:20px;
flex-wrap:wrap;
">

<h2>
Orders
</h2>

<button
class="clear-btn"
onclick="clearOrders()"
>
Clear All Orders
</button>

</div>

<div id="message"></div>

<div id="ordersList">

<div class="loading">
Checking admin access...
</div>

</div>

</div>

</main>


<script src="products.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
  "https://yaukdrdygrlpdrhzpbvv.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_So5A7k5nsnnKyvC-MkiTMw_t6Q9poOO";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================
   ADMIN SECURITY
========================================= */

async function checkAdmin(){

  /* Check active login session */

  const {
    data: sessionData,
    error: sessionError
  } =
    await supabaseClient.auth.getSession();


  if(
    sessionError ||
    !sessionData.session
  ){

    window.location.href =
      "login.html";

    return false;

  }


  /* Check Admin permission */

  const {
    data: isAdmin,
    error: adminError
  } =
    await supabaseClient
      .rpc("is_admin");


  if(
    adminError ||
    !isAdmin
  ){

    await supabaseClient.auth.signOut();

    alert(
      "Access denied. Admin account required."
    );

    window.location.href =
      "login.html";

    return false;

  }


  return true;

}


/* =========================================
   LOGOUT
========================================= */

async function logout(){

  const {
    error
  } =
    await supabaseClient.auth.signOut();


  if(error){

    alert(
      "Logout failed: " +
      error.message
    );

    return;

  }


  window.location.href =
    "login.html";

}


/* =========================================
   MESSAGE
========================================= */

function showError(message){

  document.getElementById(
    "message"
  ).innerHTML = `

    <div class="error">
      ${message}
    </div>

  `;

}


function showSuccess(message){

  document.getElementById(
    "message"
  ).innerHTML = `

    <div class="success">
      ${message}
    </div>

  `;

}


/* =========================================
   LOAD ORDERS
========================================= */

async function getOrders(){

  const {
    data,
    error
  } =
    await supabaseClient
      .from("orders")
      .select("*")
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(error){

    console.error(error);

    showError(
      "Could not load orders: " +
      error.message
    );

    return [];

  }


  return data || [];

}


/* =========================================
   STATUS CLASS
========================================= */

function getStatusClass(status){

  const value =
    String(status || "")
      .toLowerCase();


  if(
    value.includes("processing")
  ){

    return "status-processing";

  }


  if(
    value.includes("shipped")
  ){

    return "status-shipped";

  }


  if(
    value.includes("delivered")
  ){

    return "status-delivered";

  }


  if(
    value.includes("cancel")
  ){

    return "status-cancelled";

  }


  return "status-new";

}


/* =========================================
   UPDATE STATUS
========================================= */

async function updateOrderStatus(
  id,
  status
){

  const allowed =
    await checkAdmin();


  if(!allowed){

    return;

  }


  const {
    error
  } =
    await supabaseClient
      .from("orders")
      .update({
        status:status
      })
      .eq(
        "id",
        id
      );


  if(error){

    alert(
      "Status update failed: " +
      error.message
    );

    return;

  }


  showSuccess(
    "Order status updated successfully."
  );


  renderDashboard();

}


/* =========================================
   RENDER DASHBOARD
========================================= */

async function renderDashboard(){

  const loggedIn =
    await checkAdmin();


  if(!loggedIn){

    return;

  }


  const orders =
    await getOrders();


  document.getElementById(
    "totalOrders"
  ).textContent =
    orders.length;


  document.getElementById(
    "totalProducts"
  ).textContent =
    products.length;


  const customers =
    new Set(
      orders
        .map(
          order =>
            (order.phone || "")
              .trim()
        )
        .filter(
          phone =>
            phone !== ""
        )
    );


  document.getElementById(
    "totalCustomers"
  ).textContent =
    customers.size;


  const container =
    document.getElementById(
      "ordersList"
    );


  container.innerHTML = "";


  if(
    orders.length === 0
  ){

    container.innerHTML = `

      <div class="no-orders">

        <h3>
          No orders yet
        </h3>

        <p>
          New customer orders will appear here.
        </p>

      </div>

    `;

    return;

  }


  orders.forEach(
    function(order){

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "order-card";


      let productsHTML = "";


      const items =
        order.items || {};


      Object.keys(items)
        .forEach(
          function(productId){

            const product =
              products.find(
                p =>
                  String(p.id) ===
                  String(productId)
              );


            if(!product){

              return;

            }


            const quantity =
              Number(
                items[productId]
              ) || 0;


            const itemTotal =
              product.price *
              quantity;


            productsHTML += `

              <div
                class="order-product"
              >

                <span>

                  ${product.name}
                  × ${quantity}

                </span>

                <strong>

                  ৳${itemTotal.toLocaleString()}

                </strong>

              </div>

            `;

          }
        );


      const status =
        order.status ||
        "New";


      const statusClass =
        getStatusClass(
          status
        );


      const date =
        order.created_at
          ? new Date(
              order.created_at
            ).toLocaleString()
          : "";


      card.innerHTML = `

        <div class="order-top">

          <div>

            <div class="order-id">

              Order ID:
              ${order.order_id}

            </div>

            <small>
              ${date}
            </small>

          </div>


          <div
            class="order-status ${statusClass}"
          >

            ${status}

          </div>

        </div>


        <div class="status-control">

          <label>
            Order Status
          </label>


          <select
            class="status-select"
            onchange="
              updateOrderStatus(
                ${order.id},
                this.value
              )
            "
          >

            <option
              value="New"
              ${status === "New" ? "selected" : ""}
            >
              New
            </option>

            <option
              value="Processing"
              ${status === "Processing" ? "selected" : ""}
            >
              Processing
            </option>

            <option
              value="Shipped"
              ${status === "Shipped" ? "selected" : ""}
            >
              Shipped
            </option>

            <option
              value="Delivered"
              ${status === "Delivered" ? "selected" : ""}
            >
              Delivered
            </option>

            <option
              value="Cancelled"
              ${status === "Cancelled" ? "selected" : ""}
            >
              Cancelled
            </option>

          </select>

        </div>


        <div class="customer">

          <strong>
            Customer
          </strong>

          <p>
            Name:
            ${order.customer_name || ""}
          </p>

          <p>
            Phone:
            ${order.phone || ""}
          </p>

          <p>
            District:
            ${order.district || ""}
          </p>

          <p>
            Address:
            ${order.address || ""}
          </p>

          <p>
            Payment:
            ${order.payment_method || ""}
          </p>

        </div>


        <h3>
          Products
        </h3>


        ${productsHTML}


        <div class="order-total">

          Total:
          ৳${Number(
            order.total || 0
          ).toLocaleString()}

        </div>


        <button
          class="delete-btn"
          onclick="
            deleteOrder(${order.id})
          "
        >

          Delete Order

        </button>

      `;


      container.appendChild(
        card
      );

    }
  );

}


/* =========================================
   DELETE ONE ORDER
========================================= */

async function deleteOrder(id){

  const allowed =
    await checkAdmin();


  if(!allowed){

    return;

  }


  if(
    !confirm(
      "Delete this order?"
    )
  ){

    return;

  }


  const {
    error
  } =
    await supabaseClient
      .from("orders")
      .delete()
      .eq(
        "id",
        id
      );


  if(error){

    alert(
      "Delete failed: " +
      error.message
    );

    return;

  }


  showSuccess(
    "Order deleted successfully."
  );


  renderDashboard();

}


/* =========================================
   CLEAR ALL ORDERS
========================================= */

async function clearOrders(){

  const allowed =
    await checkAdmin();


  if(!allowed){

    return;

  }


  const orders =
    await getOrders();


  if(
    orders.length === 0
  ){

    alert(
      "There are no orders."
    );

    return;

  }


  if(
    !confirm(
      "Are you sure you want to delete all orders?"
    )
  ){

    return;

  }


  const {
    error
  } =
    await supabaseClient
      .from("orders")
      .delete()
      .neq(
        "id",
        0
      );


  if(error){

    alert(
      "Could not clear orders: " +
      error.message
    );

    return;

  }


  showSuccess(
    "All orders deleted successfully."
  );


  renderDashboard();

}


/* =========================================
   START
========================================= */

renderDashboard();

</script>

</body>

</html>
