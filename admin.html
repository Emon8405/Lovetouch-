<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Admin Panel | Lovetouch</title>

<link rel="stylesheet" href="style.css">

<style>

body{
  background:#f5f5f5;
}

.admin-header{
  background:#131921;
  color:white;
  padding:18px 5%;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.admin-logo{
  color:#ff9900;
  font-size:27px;
  font-weight:bold;
}

.admin-header a{
  color:white;
  font-weight:bold;
}

.admin-page{
  max-width:1200px;
  margin:30px auto;
  padding:20px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
  margin-bottom:25px;
}

.stat{
  background:white;
  padding:25px;
  border-radius:8px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.stat-number{
  font-size:30px;
  font-weight:bold;
  margin-top:8px;
}

.orders-box{
  background:white;
  padding:25px;
  border-radius:8px;
  overflow-x:auto;
}

.order-card{
  border:1px solid #ddd;
  border-radius:7px;
  padding:20px;
  margin-bottom:15px;
}

.order-top{
  display:flex;
  justify-content:space-between;
  gap:15px;
  flex-wrap:wrap;
  margin-bottom:15px;
}

.order-id{
  font-weight:bold;
}

.order-status{
  background:#fff3cd;
  padding:6px 12px;
  border-radius:20px;
  font-size:13px;
}

.customer{
  background:#f8f8f8;
  padding:15px;
  border-radius:6px;
  margin-bottom:15px;
}

.order-product{
  display:flex;
  justify-content:space-between;
  padding:8px 0;
  border-bottom:1px solid #eee;
}

.order-total{
  text-align:right;
  font-size:20px;
  font-weight:bold;
  margin-top:15px;
}

.delete-btn{
  background:#d62828;
  color:white;
  border:0;
  padding:9px 15px;
  border-radius:5px;
  cursor:pointer;
  margin-top:15px;
}

.clear-btn{
  background:#d62828;
  color:white;
  border:0;
  padding:12px 18px;
  border-radius:5px;
  cursor:pointer;
  font-weight:bold;
}

.no-orders{
  text-align:center;
  padding:50px;
  color:#777;
}

@media(max-width:700px){

  .stats{
    grid-template-columns:1fr;
  }

}

</style>

</head>

<body>

<header class="admin-header">

<div class="admin-logo">
Lovetouch Admin
</div>

<a href="index.html">
← Visit Store
</a>

</header>

<main class="admin-page">

<h1>
Dashboard
</h1>

<br>

<div class="stats">

<div class="stat">

<div>
Total Orders
</div>

<div
class="stat-number"
id="totalOrders"
>
0
</div>

</div>

<div class="stat">

<div>
Total Products
</div>

<div
class="stat-number"
id="totalProducts"
>
0
</div>

</div>

<div class="stat">

<div>
Total Customers
</div>

<div
class="stat-number"
id="totalCustomers"
>
0
</div>

</div>

</div>

<div class="orders-box">

<div style="
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
margin-bottom:20px;
flex-wrap:wrap;
">

<h2>
Orders
</h2>

<button
class="clear-btn"
onclick="clearOrders()"
>
Clear All Orders
</button>

</div>

<div id="ordersList">
</div>

</div>

</main>

<script src="products.js"></script>

<script>

function getOrders(){

  return JSON.parse(
    localStorage.getItem(
      "lovetouchOrders"
    )
  ) || [];

}


function renderDashboard(){

  const orders =
    getOrders();

  const users =
    JSON.parse(
      localStorage.getItem(
        "lovetouchUsers"
      )
    ) || [];


  document.getElementById(
    "totalOrders"
  ).textContent =
    orders.length;


  document.getElementById(
    "totalProducts"
  ).textContent =
    products.length;


  document.getElementById(
    "totalCustomers"
  ).textContent =
    users.length;


  const container =
    document.getElementById(
      "ordersList"
    );


  container.innerHTML="";


  if(orders.length === 0){

    container.innerHTML = `

      <div class="no-orders">

        <h3>
          No orders yet
        </h3>

        <p>
          New customer orders will appear here.
        </p>

      </div>

    `;

    return;

  }


  orders
    .slice()
    .reverse()
    .forEach(
      function(order){

        const card =
          document.createElement(
            "div"
          );

        card.className =
          "order-card";


        let productsHTML="";

        let orderTotal=0;


        Object.keys(order.items)
          .forEach(
            function(productId){

              const product =
                products.find(
                  p =>
                    p.id === productId
                );


              if(!product){
                return;
              }


              const quantity =
                order.items[
                  productId
                ];


              const itemTotal =
                product.price *
                quantity;


              orderTotal +=
                itemTotal;


              productsHTML += `

                <div
                  class="order-product"
                >

                  <span>
                    ${product.name}
                    × ${quantity}
                  </span>

                  <strong>
                    ৳${itemTotal.toLocaleString()}
                  </strong>

                </div>

              `;

            }
          );


        const delivery =
          orderTotal > 0
            ? 100
            : 0;


        const grandTotal =
          orderTotal +
          delivery;


        const date =
          order.date
            ? new Date(
                order.date
              ).toLocaleString()
            : "";


        card.innerHTML = `

          <div class="order-top">

            <div>

              <div class="order-id">
                Order ID:
                ${order.id}
              </div>

              <small>
                ${date}
              </small>

            </div>

            <div class="order-status">
              New Order
            </div>

          </div>


          <div class="customer">

            <strong>
              Customer
            </strong>

            <p>
              Name:
              ${order.customer.name}
            </p>

            <p>
              Phone:
              ${order.customer.phone}
            </p>

            <p>
              District:
              ${order.customer.district}
            </p>

            <p>
              Address:
              ${order.customer.address}
            </p>

            <p>
              Payment:
              ${order.payment}
            </p>

          </div>


          <h3>
            Products
          </h3>

          ${productsHTML}


          <div class="order-total">

            Total:
            ৳${grandTotal.toLocaleString()}

          </div>


          <button
            class="delete-btn"
            onclick="deleteOrder('${order.id}')"
          >
            Delete Order
          </button>

        `;


        container.appendChild(card);

      }
    );

}


function deleteOrder(orderId){

  if(
    !confirm(
      "Delete this order?"
    )
  ){
    return;
  }


  let orders =
    getOrders();


  orders =
    orders.filter(
      order =>
        order.id !== orderId
    );


  localStorage.setItem(
    "lovetouchOrders",
    JSON.stringify(orders)
  );


  renderDashboard();

}


function clearOrders(){

  const orders =
    getOrders();


  if(orders.length === 0){

    alert(
      "There are no orders."
    );

    return;

  }


  if(
    !confirm(
      "Are you sure you want to delete all orders?"
    )
  ){
    return;
  }


  localStorage.removeItem(
    "lovetouchOrders"
  );


  renderDashboard();

}


renderDashboard();

</script>

</body>

</html>
