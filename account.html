<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>My Account | Lovetouch</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f5f5f5;
  font-family:Arial,sans-serif;
  color:#222;
}

header{
  background:#131921;
  color:white;
  padding:18px 5%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
}

.logo{
  color:#ff9900;
  font-size:27px;
  font-weight:bold;
  text-decoration:none;
}

.header-links{
  display:flex;
  gap:18px;
}

.header-links a{
  color:white;
  text-decoration:none;
  font-weight:bold;
}

main{
  max-width:1000px;
  margin:30px auto;
  padding:20px;
}

.account-box{
  background:white;
  padding:25px;
  border-radius:8px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  margin-bottom:25px;
}

.account-box h1{
  margin-top:0;
}

.order-card{
  border:1px solid #ddd;
  border-radius:8px;
  padding:20px;
  margin-bottom:18px;
}

.order-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
  border-bottom:1px solid #eee;
  padding-bottom:15px;
  margin-bottom:15px;
}

.order-id{
  font-weight:bold;
  font-size:18px;
}

.status{
  padding:7px 14px;
  border-radius:20px;
  font-size:13px;
  font-weight:bold;
  background:#fff3cd;
}

.customer-info{
  background:#f8f8f8;
  padding:15px;
  border-radius:6px;
  margin-bottom:15px;
}

.product-row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:8px 0;
  border-bottom:1px solid #eee;
}

.total{
  text-align:right;
  font-size:20px;
  font-weight:bold;
  margin-top:15px;
}

.empty{
  text-align:center;
  padding:50px 20px;
  color:#777;
}

.shop-btn{
  display:inline-block;
  margin-top:15px;
  padding:12px 22px;
  background:#ff9900;
  color:#222;
  text-decoration:none;
  border-radius:5px;
  font-weight:bold;
}

.logout-btn{
  border:0;
  background:#d62828;
  color:white;
  padding:10px 16px;
  border-radius:5px;
  cursor:pointer;
  font-weight:bold;
}

.loading{
  text-align:center;
  padding:40px;
}

.error{
  background:#ffe5e5;
  color:#b00020;
  padding:15px;
  border-radius:6px;
}

@media(max-width:700px){

  header{
    flex-direction:column;
    align-items:flex-start;
  }

  .product-row{
    flex-direction:column;
    gap:5px;
  }

}

</style>

</head>

<body>

<header>

<a href="index.html"
class="logo">
Lovetouch
</a>

<div class="header-links">

<a href="index.html">
Home
</a>

<a href="cart.html">
🛒 Cart
</a>

<button
class="logout-btn"
onclick="logout()"
>
Logout
</button>

</div>

</header>


<main>

<div class="account-box">

<h1>
👤 My Account
</h1>

<p id="userEmail">
Loading account...
</p>

</div>


<div class="account-box">

<h2>
📦 My Orders
</h2>

<div id="ordersList">

<div class="loading">
Loading orders...
</div>

</div>

</div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://yaukdrdygrlpdrhzpbvv.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_So5A7k5nsnnKyvC-MkiTMw_t6Q9poOO";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


async function loadAccount(){

  const {
    data,
    error
  } =
  await supabaseClient
    .auth
    .getUser();


  if(error || !data.user){

    document.getElementById(
      "userEmail"
    ).textContent =
      "Customer account";


    loadOrders();

    return;

  }


  document.getElementById(
    "userEmail"
  ).textContent =
    data.user.email;


  loadOrders();

}


async function loadOrders(){

  const container =
    document.getElementById(
      "ordersList"
    );


  const {
    data,
    error
  } =
  await supabaseClient
    .from("orders")
    .select("*")
    .order(
      "created_at",
      {
        ascending:false
      }
    );


  if(error){

    container.innerHTML = `

      <div class="error">

        Unable to load orders.

        <br><br>

        ${error.message}

      </div>

    `;

    return;

  }


  if(!data || data.length === 0){

    container.innerHTML = `

      <div class="empty">

        <h3>
          No orders yet
        </h3>

        <p>
          Your orders will appear here.
        </p>

        <a
          href="index.html"
          class="shop-btn"
        >
          Start Shopping
        </a>

      </div>

    `;

    return;

  }


  container.innerHTML = "";


  data.forEach(
    function(order){

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "order-card";


      let productsHTML = "";


      if(order.items){

        Object.keys(
          order.items
        ).forEach(
          function(productId){

            const quantity =
              Number(
                order.items[
                  productId
                ]
              ) || 0;


            productsHTML += `

              <div
                class="product-row"
              >

                <span>
                  Product ID:
                  ${productId}
                </span>

                <strong>
                  × ${quantity}
                </strong>

              </div>

            `;

          }
        );

      }


      const date =
        order.created_at
          ? new Date(
              order.created_at
            ).toLocaleString()
          : "";


      const status =
        order.status || "New";


      card.innerHTML = `

        <div class="order-header">

          <div>

            <div class="order-id">

              Order ID:
              ${order.order_id}

            </div>

            <small>
              ${date}
            </small>

          </div>


          <div class="status">

            ${status}

          </div>

        </div>


        <div class="customer-info">

          <strong>
            Delivery Information
          </strong>

          <p>
            Name:
            ${order.customer_name || ""}
          </p>

          <p>
            Phone:
            ${order.phone || ""}
          </p>

          <p>
            District:
            ${order.district || ""}
          </p>

          <p>
            Address:
            ${order.address || ""}
          </p>

          <p>
            Payment:
            ${order.payment_method || ""}
          </p>

        </div>


        <h3>
          Products
        </h3>


        ${productsHTML}


        <div class="total">

          Total:
          ৳${Number(
            order.total || 0
          ).toLocaleString()}

        </div>

      `;


      container.appendChild(
        card
      );

    }
  );

}


async function logout(){

  await supabaseClient
    .auth
    .signOut();


  window.location.href =
    "index.html";

}


loadAccount();

</script>

</body>

  </html>
